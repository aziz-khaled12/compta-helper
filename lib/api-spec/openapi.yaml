openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DJERDJERA Comptable API - Algerian small-business accounting
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
  - name: company
  - name: assets
  - name: transactions
  - name: inventory
  - name: employees
  - name: payroll
  - name: dashboard
  - name: legal
  - name: insights
    description: Legal texts from the Journal Officiel matched to the company's declared identity.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Login and receive access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Get a new access token using the refresh token cookie
      responses:
        '200':
          description: Refresh successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Clear session and revoke refresh token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ============ COMPANY ============
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the active company profile (single tenant)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
    put:
      operationId: upsertCompany
      tags: [company]
      summary: Create or update the company profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }

  /company/funding:
    get:
      operationId: listFunding
      tags: [company]
      summary: List capital funding entries (own funds + bank loans)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FundingEntry" }
    post:
      operationId: createFunding
      tags: [company]
      summary: Add a funding source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FundingInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FundingEntry" }
  /company/funding/{id}:
    delete:
      operationId: deleteFunding
      tags: [company]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  # ============ FIXED ASSETS ============
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List fixed assets (equipment) with computed depreciation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FixedAsset" }
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a fixed asset (auto-generates monthly amortization log)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixedAssetInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixedAsset" }
  /assets/{id}:
    delete:
      operationId: deleteAsset
      tags: [assets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
  /assets/{id}/amortization:
    get:
      operationId: getAssetAmortization
      tags: [assets]
      summary: Monthly amortization schedule for an asset
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AmortizationEntry" }

  # ============ TRANSACTIONS (JOURNAL) ============
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List journal entries
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [SALE, PURCHASE, EXPENSE]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a sale, purchase, or expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
  /transactions/{id}:
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  # ============ INVENTORY ============
  /inventory/items:
    get:
      operationId: listInventoryItems
      tags: [inventory]
      summary: List inventory items with current balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryItem" }
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Create an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
  /inventory/items/{id}:
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /inventory/movements:
    get:
      operationId: listInventoryMovements
      tags: [inventory]
      summary: List stock movements (in/out)
      parameters:
        - name: itemId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryMovement" }
    post:
      operationId: createInventoryMovement
      tags: [inventory]
      summary: Record a stock movement (consumption, production)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryMovementInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovement" }

  # ============ EMPLOYEES ============
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Add an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /employees/{id}:
    delete:
      operationId: deleteEmployee
      tags: [employees]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  # ============ PAYROLL ============
  /payrolls:
    get:
      operationId: listPayrolls
      tags: [payroll]
      summary: List generated payslips
      parameters:
        - name: monthYear
          in: query
          required: false
          schema: { type: string, description: "YYYY-MM" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payroll" }
    post:
      operationId: generatePayroll
      tags: [payroll]
      summary: Generate a payslip for an employee for a given month (auto-computes CNAS 9% + IRG)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayrollInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payroll" }
  /payrolls/{id}:
    delete:
      operationId: deletePayroll
      tags: [payroll]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  # ============ DASHBOARD (WOW endpoints) ============
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level financial KPIs (revenue, expenses, TVA balance, profit, cash position)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/monthly-pnl:
    get:
      operationId: getMonthlyPnl
      tags: [dashboard]
      summary: Monthly profit and loss for the last 12 months
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonthlyPnlEntry" }
  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent journal entries across all types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
  /dashboard/tva:
    get:
      operationId: getTvaSummary
      tags: [dashboard]
      summary: TVA collectée vs déductible (and net to declare)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TvaSummary" }
  /legal/alerts:
    get:
      operationId: listLegalAlerts
      tags: [legal]
      summary: Journal Officiel texts judged relevant to this company
      description: >
        Newest first. Acknowledged alerts are hidden by default — a business owner
        who has dealt with a text should not have to keep scrolling past it.
      parameters:
        - name: includeAcknowledged
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegalAlert" }
  /legal/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeLegalAlert
      tags: [legal]
      summary: Mark a legal alert as dealt with
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAlert" }
  /legal/refresh:
    post:
      operationId: refreshLegalAlerts
      tags: [legal]
      summary: Re-match the stored corpus against this company's current identity
      description: >
        Matching happens as documents arrive, so a company that declared its
        sector after the crawl would otherwise see nothing until the next issue
        is published. This recomputes the whole set on demand.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalAlertRefresh" }
  /insights/narrate:
    post:
      operationId: narrateInsights
      tags: [insights]
      summary: Explain and prioritise findings the browser already computed
      description: >
        The Rapports page detects findings in the browser — it is client-side by
        convention, and re-deriving its aggregates server-side would create a
        second source of truth. So only the findings cross the wire, never the
        ledger: the API key stays here and the company's rows stay in the browser.

        Gemini receives figures that deterministic code already produced and is
        asked to order and explain them. It is never asked to compute anything —
        the numbers in the narrative are the ones in the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InsightNarrateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InsightsNarrative" }
        "503":
          description: >
            Narration is unavailable — no API key, or Gemini declined every
            attempt. The caller already holds the deterministic explanation for
            every finding, so this is expected to degrade to that text rather
            than surface an error.

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        firstName:
          type: string
        lastName:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    TokenResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Company:
      type: object
      required: [id, name, nif, ai, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        nif: { type: string, description: "Numéro d'Identification Fiscale" }
        ai: { type: string, description: "Article d'Imposition" }
        address: { type: string, nullable: true }
        legalForm: { type: string, nullable: true, description: "e.g. EURL, SARL, SNC" }
        taxRegime:
          type: string
          nullable: true
          enum: [FORFAITAIRE, REEL]
          description: >-
            Algerian tax system: FORFAITAIRE (النظام الجزافي) files the G12,
            REEL (النظام الحقيقي) files the G50.
        sectorCode:
          type: string
          nullable: true
          description: >-
            Sector of activity, as a code from the @workspace/sectors catalogue.
            Used to filter Journal Officiel decrees down to the ones that
            concern this company. Deliberately not an enum here: the catalogue
            is TypeScript and is the single source of truth for valid codes, so
            an enum duplicated into this file would drift. The server validates
            the code against the catalogue and rejects an unknown one.
        sectorLabel:
          type: string
          nullable: true
          description: >-
            Human-readable sector name, derived server-side from sectorCode.
            Returned only — a client cannot set it, so the stored label can
            never disagree with the code it belongs to.
        createdAt: { type: string, format: date-time }
    CompanyInput:
      type: object
      required: [name, nif, ai]
      properties:
        name: { type: string, minLength: 1 }
        nif: { type: string, minLength: 1 }
        ai: { type: string, minLength: 1 }
        address: { type: string, nullable: true }
        legalForm: { type: string, nullable: true }
        taxRegime:
          type: string
          nullable: true
          enum: [FORFAITAIRE, REEL]
          description: >-
            Algerian tax system: FORFAITAIRE (النظام الجزافي) files the G12,
            REEL (النظام الحقيقي) files the G50.
        sectorCode:
          type: string
          nullable: true
          description: >-
            Sector of activity, as a code from the @workspace/sectors catalogue.
            Validated server-side against that catalogue. `sectorLabel` is
            derived from it and is therefore not accepted on input.

    FundingEntry:
      type: object
      required: [id, source, amount, date]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [OWN_FUNDS, BANK_LOAN] }
        label: { type: string, nullable: true }
        amount: { type: number }
        date: { type: string, format: date }
        interestRate: { type: number, nullable: true, description: "Annual rate for loans (e.g. 6.5)" }
        durationMonths: { type: integer, nullable: true }
    FundingInput:
      type: object
      required: [source, amount, date]
      properties:
        source: { type: string, enum: [OWN_FUNDS, BANK_LOAN] }
        label: { type: string, nullable: true }
        amount: { type: number, minimum: 0 }
        date: { type: string, format: date }
        interestRate: { type: number, nullable: true }
        durationMonths: { type: integer, nullable: true }

    FixedAsset:
      type: object
      required: [id, label, costHt, purchaseDate, lifeYears, residualValue, monthlyDepreciation, accumulatedDepreciation, bookValue]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        category: { type: string, nullable: true, description: "e.g. Industrial Equipment, Vehicle, Computer" }
        costHt: { type: number }
        purchaseDate: { type: string, format: date }
        lifeYears: { type: integer }
        residualValue: { type: number }
        monthlyDepreciation: { type: number }
        accumulatedDepreciation: { type: number }
        bookValue: { type: number }
    FixedAssetInput:
      type: object
      required: [label, costHt, purchaseDate, lifeYears]
      properties:
        label: { type: string, minLength: 1 }
        category: { type: string, nullable: true }
        costHt: { type: number, minimum: 0 }
        purchaseDate: { type: string, format: date }
        lifeYears: { type: integer, minimum: 1, maximum: 50 }
        residualValue: { type: number, minimum: 0, default: 0 }

    AmortizationEntry:
      type: object
      required: [id, date, amount]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { type: number }

    Transaction:
      type: object
      required: [id, date, type, label, amountHt, tvaRate, tvaAmount, amountTtc, paymentMethod, status]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        type: { type: string, enum: [SALE, PURCHASE, EXPENSE] }
        label: { type: string }
        amountHt: { type: number }
        tvaRate: { type: number }
        tvaAmount: { type: number }
        amountTtc: { type: number }
        paymentMethod: { type: string, enum: [CASH, BANK, CREDIT] }
        status: { type: string, enum: [PAID, UNPAID, PARTIAL] }
        thirdParty: { type: string, nullable: true, description: "Customer or supplier name" }
        category: { type: string, nullable: true, description: "e.g. RENT, ELECTRICITY, SUPPLIES, RAW_MATERIALS" }
        itemId: { type: string, format: uuid, nullable: true, description: "Stock article this entry moved, if any" }
        quantity: { type: number, nullable: true, description: "Quantity of the article moved" }
        unitCostHt:
          type: number
          nullable: true
          description: >-
            The CUMP applied when this entry was posted. Frozen at posting time:
            CUMP moves with the stock, so recomputing an old entry at today's
            average would restate books that have already been closed.
        costOfGoodsSold:
          type: number
          nullable: true
          description: "quantity x unitCostHt. Relieved on a sale (class 6); null otherwise."
    TransactionInput:
      type: object
      required: [date, type, label, amountHt, tvaRate, paymentMethod, status]
      properties:
        date: { type: string, format: date }
        type: { type: string, enum: [SALE, PURCHASE, EXPENSE] }
        label: { type: string, minLength: 1 }
        amountHt: { type: number, minimum: 0 }
        tvaRate: { type: number, minimum: 0, maximum: 100 }
        paymentMethod: { type: string, enum: [CASH, BANK, CREDIT] }
        status: { type: string, enum: [PAID, UNPAID, PARTIAL] }
        thirdParty: { type: string, nullable: true }
        category: { type: string, nullable: true }
        itemId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional stock article. A SALE naming one relieves inventory at the
            CUMP and records the cost; a PURCHASE naming one feeds it at
            amountHt / quantity. Entries without an itemId behave as before.
        quantity:
          type: number
          nullable: true
          minimum: 0
          description: Required whenever itemId is given.

    InventoryItem:
      type: object
      required: [id, name, category, balance, averageCost, totalValue]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, enum: [RAW_MATERIAL, FINISHED_GOOD, SUPPLY] }
        unit: { type: string, nullable: true, description: "e.g. kg, L, unit" }
        balance: { type: number }
        averageCost: { type: number }
        totalValue: { type: number }
    InventoryItemInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, enum: [RAW_MATERIAL, FINISHED_GOOD, SUPPLY] }
        unit: { type: string, nullable: true }

    InventoryMovement:
      type: object
      required: [id, itemId, itemName, date, quantity, direction, unitCostHt]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        itemName: { type: string }
        date: { type: string, format: date }
        quantity: { type: number }
        direction: { type: string, enum: [IN, OUT] }
        unitCostHt: { type: number }
        note: { type: string, nullable: true }
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The journal entry that generated this movement, if any. Null for
            movements entered by hand on the Stocks page.
    InventoryMovementInput:
      type: object
      required: [itemId, date, quantity, direction]
      properties:
        itemId: { type: string, format: uuid }
        date: { type: string, format: date }
        quantity: { type: number, minimum: 0 }
        direction: { type: string, enum: [IN, OUT] }
        unitCostHt:
          type: number
          nullable: true
          minimum: 0
          description: >-
            Required for an IN. Optional for an OUT, where omitting it (or
            sending 0) applies the article's current CUMP.
        note: { type: string, nullable: true }

    Employee:
      type: object
      required: [id, fullName, familySituation, baseSalary, hireDate]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        position: { type: string, nullable: true }
        familySituation: { type: string, enum: [SINGLE, MARRIED, MARRIED_1_CHILD, MARRIED_2_CHILDREN, MARRIED_3_CHILDREN, MARRIED_4_PLUS_CHILDREN] }
        baseSalary: { type: number }
        experienceYears: { type: integer, default: 0 }
        hireDate: { type: string, format: date }
    EmployeeInput:
      type: object
      required: [fullName, familySituation, baseSalary, hireDate]
      properties:
        fullName: { type: string, minLength: 1 }
        position: { type: string, nullable: true }
        familySituation: { type: string, enum: [SINGLE, MARRIED, MARRIED_1_CHILD, MARRIED_2_CHILDREN, MARRIED_3_CHILDREN, MARRIED_4_PLUS_CHILDREN] }
        baseSalary: { type: number, minimum: 0 }
        experienceYears: { type: integer, minimum: 0, default: 0 }
        hireDate: { type: string, format: date }

    Payroll:
      type: object
      required: [id, employeeId, employeeName, monthYear, baseSalary, experienceBonus, grossSalary, cnasDeduction, taxableBase, irgDeduction, netToPay, generatedAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: string, format: uuid }
        employeeName: { type: string }
        monthYear: { type: string, description: "YYYY-MM" }
        baseSalary: { type: number }
        experienceBonus: { type: number }
        grossSalary: { type: number }
        cnasDeduction: { type: number, description: "9% Social Security" }
        taxableBase: { type: number }
        irgDeduction: { type: number, description: "Algerian IRG scale" }
        netToPay: { type: number }
        generatedAt: { type: string, format: date-time }
    PayrollInput:
      type: object
      required: [employeeId, monthYear]
      properties:
        employeeId: { type: string, format: uuid }
        monthYear: { type: string, description: "YYYY-MM" }
        bonus: { type: number, default: 0 }

    DashboardSummary:
      type: object
      required: [totalRevenueHt, totalPurchasesHt, totalExpensesHt, tvaCollectee, tvaDeductible, tvaNet, grossProfit, netProfit, totalAssetsValue, totalEmployees, totalPayrollMonth, cashPosition, totalStockValue, totalStockItems, recentMovementsCount]
      properties:
        totalRevenueHt: { type: number }
        totalPurchasesHt: { type: number }
        totalExpensesHt: { type: number }
        tvaCollectee: { type: number }
        tvaDeductible: { type: number }
        tvaNet: { type: number, description: "TVA Collectée - TVA Déductible (positive = to pay, negative = credit)" }
        grossProfit: { type: number }
        netProfit: { type: number }
        totalAssetsValue: { type: number, description: "Net book value across all fixed assets" }
        totalEmployees: { type: integer }
        totalPayrollMonth: { type: number, description: "Total net payroll for current month" }
        cashPosition: { type: number, description: "Funding + paid sales - paid purchases - paid expenses - paid payroll" }
        totalStockValue: { type: number, description: "Weighted-average total value of all inventory items" }
        totalStockItems: { type: integer, description: "Number of distinct stock items" }
        recentMovementsCount: { type: integer, description: "Number of inventory movements in the last 30 days" }

    MonthlyPnlEntry:
      type: object
      required: [monthYear, revenue, expenses, profit]
      properties:
        monthYear: { type: string }
        revenue: { type: number }
        expenses: { type: number }
        profit: { type: number }

    TvaSummary:
      type: object
      required: [period, tvaCollectee, tvaDeductible, net]
      properties:
        period: { type: string }
        tvaCollectee: { type: number }
        tvaDeductible: { type: number }
        net: { type: number }

    LegalAlertMatch:
      type: object
      description: >
        The signals that made this text relevant. Structured rather than prose so
        the client can phrase the reason in the user's own words — a business
        owner needs to see *why* a text concerns them, in a sentence they can
        read, not an opaque score.
      required: [sectors, keywords, legalForm, taxRegime]
      properties:
        sectors: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        legalForm: { type: boolean }
        taxRegime: { type: boolean }

    LegalAlert:
      type: object
      required: [id, documentId, docKind, relevance, matchScore, matchedOn, year, issueNumber, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        docKind: { type: string, description: "e.g. Décret exécutif, Arrêté interministériel" }
        docNumber: { type: string, nullable: true }
        titleFr: { type: string, nullable: true }
        titleAr: { type: string, nullable: true }
        summaryFr: { type: string, nullable: true, description: "One sentence, written for a non-lawyer" }
        summaryAr: { type: string, nullable: true }
        publishedOn: { type: string, format: date, nullable: true }
        pageFrom: { type: integer, nullable: true }
        year: { type: integer }
        issueNumber: { type: integer, description: "Journal Officiel issue number" }
        relevance: { type: string, enum: [HIGH, MEDIUM, LOW] }
        matchScore: { type: number }
        matchedOn: { $ref: "#/components/schemas/LegalAlertMatch" }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    LegalAlertRefresh:
      type: object
      required: [refreshed]
      properties:
        refreshed: { type: integer, description: "Number of alerts written" }

    InsightFinding:
      type: object
      description: >
        One observation, as the browser computed it. The field names mirror the
        client's `Finding` exactly, because this is a mirror of that type rather
        than a re-modelling of it.
      required: [ruleId, severity, title, periodRef]
      properties:
        ruleId:
          type: string
          description: >
            The knowledge-base key. Opaque to the server, which only echoes it
            back — the client owns the rules and their wording.
        severity: { type: string, enum: [CRITICAL, WARNING, INFO] }
        title: { type: string }
        evidence:
          type: array
          items: { type: string }
          description: "The figures behind the finding, already formatted for reading"
        metrics:
          type: object
          additionalProperties: { type: number }
          description: "The same figures unformatted — what the narration may reason over"
        periodRef: { type: string }
        subject: { type: string, nullable: true }

    InsightNarrateInput:
      type: object
      required: [findings]
      properties:
        periodFrom: { type: string, format: date, nullable: true }
        periodTo: { type: string, format: date, nullable: true }
        findings:
          type: array
          items: { $ref: "#/components/schemas/InsightFinding" }

    InsightPriority:
      type: object
      required: [ruleId, whyItMatters, action]
      properties:
        ruleId:
          type: string
          description: "Echoes one of the ruleIds in the request — never a new one"
        whyItMatters: { type: string }
        action: { type: string }

    InsightsNarrative:
      type: object
      required: [summary, priorities, model, cached]
      properties:
        summary:
          type: string
          description: "Two or three sentences, in plain French, for a business owner"
        priorities:
          type: array
          items: { $ref: "#/components/schemas/InsightPriority" }
        model: { type: string }
        cached:
          type: boolean
          description: "True when this is a stored narrative for identical findings"
